version: "2"
name: "MuConsole Post-Merge Main Validation"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --all -- --check"

  - id: docs-check
    name: "Verify Markdown Formatting (mdformat-gfm)"
    tags: ["fmt"]
    depends_on: ["fmt-check"]
    threads: 1
    run: "./scripts/format_docs.sh --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    depends_on: ["fmt-check", "docs-check"]
    threads: 4
    run: "cargo clippy --workspace --all-targets -- -D warnings"

  - id: coverage-test
    name: "Evaluate Test Suite & Line Code Coverage"
    tags: ["test"]
    depends_on: ["clippy-check"]
    threads: 4
    run: "cargo llvm-cov --workspace --summary-only"

  - id: wasm32-build
    name: "Validate WASM32 Build (ui, data, protocol, theme)"
    tags: ["build"]
    depends_on: ["clippy-check"]
    threads: 4
    run: "cargo build --target wasm32-unknown-unknown -p muconsole-ui -p muconsole-data -p muconsole-protocol -p muconsole-theme"

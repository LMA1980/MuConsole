# Nginx Virtual Host Configuration for MuConsole (Parallel Dedicated Console Host)
# Domain: console.lma1980.duckdns.org
#
# Serves MuConsole static WASM/JS/CSS/WOFF2 assets at / with dual-layer caching
# and proxies read-only CI/CD APIs while keeping POST /webhook strictly on
# hook.lma1980.duckdns.org.

server {
    listen 80;
    listen [::]:80;
    server_name console.lma1980.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 8080;
    listen [::]:8080;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.lma1980.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;

    root /var/www/muconsole;
    index index.html;

    # 1. Webhook Ingress is strictly restricted to hook.lma1980.duckdns.org
    location = /webhook {
        return 404;
    }
    location ^~ /webhook/ {
        return 404;
    }

    # 2. Read-only Continuous Delivery (MuConDe-controller) API & SSE Gate Progress
    location ^~ /api/cd/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass https://192.0.2.20:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
    }

    # 3. Read-only Artifact Registry (MuRegist) API (Packages, Canaries/Taints, CAS Health)
    location ^~ /api/reg/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /api/v1/registry/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 4. Read-only Observability (MuObserve) API (Smartscape, Problems, PurePath Traces, OTLP Logs, Metrics, Store)
    location ^~ /api/obs/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:9095/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /api/observe/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:9095/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 5. Continuous Integration (ActionRunner-controller) REST API, Queue & SSE
    location ~ ^/(api|queue|health|events) {
        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
    }

    # 4. Dynamic Factory Scorecards & Status Badges
    location ~ ^/(cards|badges)/ {
        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 5. Dual-Layer Caching Layer 2: WASM binaries, Worker JS modules, CSS, and WOFF2 fonts
    # Content-hash URL busting (?v=<hash>) paired with ETag + no-cache, must-revalidate
    location ~* \.(?:wasm|js|css|d\.ts|woff2?|png|svg|ico)$ {
        etag on;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 6. Dual-Layer Caching Layer 1: HTML Entry Point & Hash Router Fallback
    # Never cache index.html so browsers immediately discover updated ?v=<hash> bundles
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}

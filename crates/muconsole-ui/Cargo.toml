[package]
name = "muconsole-ui"
description = "MuConsole main-thread WASM UI module (SVG renderer); spawns the data worker. Leptos lands in Phase 3"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "muconsole-ui"
path = "src/main.rs"

[dependencies]
muconsole-protocol = { workspace = true }
muconsole-theme = { workspace = true }
muconsole-layout = { workspace = true }

[dev-dependencies]
muconsole-data = { path = "../muconsole-data" }
postcard = { workspace = true }
roxmltree = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "Event",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[package]
name = "muconsole-data"
description = "MuConsole data module (dedicated Web Worker WASM): fetch + SSE client, normalized store, diffing, <=10 Hz coalescing, offline snapshot and fixture scenario player"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "muconsole-data"
path = "src/main.rs"

[dependencies]
muconsole-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Cache",
    "CacheStorage",
    "DedicatedWorkerGlobalScope",
    "Headers",
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "WorkerGlobalScope",
] }
